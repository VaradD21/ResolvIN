<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Glow Shield -->
  <path d="M256 72 C336 104 384 120 408 128 C408 272 352 384 256 440 C160 384 104 272 104 128 C128 120 176 104 256 72 Z"
        fill="url(#shieldGrad)"
        filter="url(#glow)" />

  <!-- Inner Subtle Border -->
  <path d="M256 96 C324 124 366 138 386 145 C386 268 338 364 256 412 C174 364 126 268 126 145 C146 138 188 124 256 96 Z"
        fill="none"
        stroke="#818cf8"
        stroke-width="8"
        stroke-opacity="0.6" />

  <!-- Center Checkmark -->
  <path d="M208 256 L240 288 L312 216"
        fill="none"
        stroke="#ffffff"
        stroke-width="32"
        stroke-linecap="round"
        stroke-linejoin="round" />
</svg>
