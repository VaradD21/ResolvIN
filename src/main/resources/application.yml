spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/resolvedesk?sslmode=disable
    username: resolvedesk
    password: resolvedesk
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

resolvedesk:
  global-max-auto-resolve-value: 5000
  llm:
    provider: ${LLM_PROVIDER:gemini}
    api-key: ${LLM_API_KEY:dummy}
    model: ${LLM_MODEL:gemini-1.5-flash}
    base-url: ${LLM_BASE_URL:}
  escalation-keywords:
    - lawyer
    - legal action
    - chargeback
    - consumer court
    - lawsuit
    - attorney
    - sue
    - legal notice
    - fuck
    - shit
    - damn
    - asshole
  mail:
    enabled: ${MAIL_ENABLED:false}
    host: ${MAIL_IMAP_HOST:imap.gmail.com}
    port: ${MAIL_IMAP_PORT:993}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    poll-interval-seconds: ${MAIL_POLL_INTERVAL_SECONDS:60}
    brand-id: ${MAIL_BRAND_ID:1}
    protocol: ${MAIL_PROTOCOL:imaps}
    folder: ${MAIL_FOLDER:INBOX}




